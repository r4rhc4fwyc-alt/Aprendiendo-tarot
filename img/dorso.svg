<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 264" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="noche" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241f52"/>
      <stop offset="0.55" stop-color="#171341"/>
      <stop offset="1" stop-color="#0c0a24"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fdf4c8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fdf4c8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="luna" cx="0.4" cy="0.38" r="0.7">
      <stop offset="0" stop-color="#fdf6d8"/>
      <stop offset="1" stop-color="#e6d79a"/>
    </radialGradient>
  </defs>

  <!-- fondo noche -->
  <rect width="150" height="264" fill="url(#noche)"/>

  <!-- estrellas -->
  <g fill="#fdf4c8">
    <circle cx="20" cy="30" r="1.3" opacity="0.9"/>
    <circle cx="120" cy="22" r="1.6" opacity="0.8"/>
    <circle cx="135" cy="60" r="1.1" opacity="0.7"/>
    <circle cx="15" cy="95" r="1.4" opacity="0.8"/>
    <circle cx="33" cy="140" r="1.1" opacity="0.6"/>
    <circle cx="128" cy="120" r="1.3" opacity="0.75"/>
    <circle cx="138" cy="170" r="1.5" opacity="0.7"/>
    <circle cx="12" cy="185" r="1.2" opacity="0.7"/>
    <circle cx="112" cy="200" r="1" opacity="0.6"/>
    <circle cx="45" cy="18" r="1" opacity="0.6"/>
    <circle cx="95" cy="235" r="1.2" opacity="0.6"/>
    <circle cx="25" cy="225" r="1.1" opacity="0.6"/>
  </g>
  <!-- destellos de 4 puntas -->
  <g fill="#fffbe9">
    <path d="M110 48 l1.4 4 4 1.4 -4 1.4 -1.4 4 -1.4 -4 -4 -1.4 4 -1.4z" opacity="0.9"/>
    <path d="M30 70 l1.1 3 3 1.1 -3 1.1 -1.1 3 -1.1 -3 -3 -1.1 3 -1.1z" opacity="0.8"/>
    <path d="M125 210 l1.1 3 3 1.1 -3 1.1 -1.1 3 -1.1 -3 -3 -1.1 3 -1.1z" opacity="0.8"/>
  </g>

  <!-- luna -->
  <circle cx="75" cy="84" r="62" fill="url(#halo)"/>
  <circle cx="75" cy="84" r="40" fill="url(#luna)"/>
  <g fill="#d9c88a" opacity="0.55">
    <circle cx="62" cy="72" r="6"/>
    <circle cx="88" cy="92" r="8"/>
    <circle cx="80" cy="66" r="4"/>
    <circle cx="66" cy="98" r="3.5"/>
  </g>

  <!-- gata negra sentada -->
  <g fill="#09080f">
    <!-- orejas -->
    <path d="M58 176 L53 146 L73 168 Z"/>
    <path d="M92 176 L97 146 L77 168 Z"/>
    <!-- cabeza -->
    <circle cx="75" cy="185" r="22"/>
    <!-- cuerpo -->
    <path d="M55 256 C44 256 43 214 55 198 C62 189 88 189 95 198 C107 214 106 256 95 256 Z"/>
    <!-- cola enroscada -->
    <path d="M96 253 C124 252 133 220 112 211" fill="none" stroke="#09080f" stroke-width="8" stroke-linecap="round"/>
  </g>
  <!-- ojos felinos -->
  <g fill="#f4d25a">
    <ellipse cx="68" cy="183" rx="3" ry="4.5"/>
    <ellipse cx="82" cy="183" rx="3" ry="4.5"/>
  </g>
  <g fill="#09080f">
    <ellipse cx="68" cy="183" rx="1" ry="4"/>
    <ellipse cx="82" cy="183" rx="1" ry="4"/>
  </g>
